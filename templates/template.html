<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f9f9f9;
            color: #333;
        }
        .invoice-box {
            background: #fff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
        }
        h1 {
            text-align: center;
            color: #007bff;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            text-align: center;
            color: #777;
        }
    </style>
</head>
<body>
<div class="invoice-box">
    <h1>Invoice</h1>
    <table>
        <tr>
            <td><strong>Customer:</strong></td>
            <td>{{customerName}}</td>
        </tr>
        <tr>
            <td><strong>Subscription ID:</strong></td>
            <td>{{subscriptionId}}</td>
        </tr>
        <tr>
            <td><strong>Invoice Date:</strong></td>
            <td>{{invoiceDate}}</td>
        </tr>
        <tr>
            <td><strong>Amount:</strong></td>
            <td>${{amount}}</td>
        </tr>
        <tr>
            <td><strong>Due Date:</strong></td>
            <td>{{dueDate}}</td>
        </tr>
    </table>
    <div class="footer">
        Generated by Zuora Billing Prototype ⚡
    </div>
</div>
</body>
</html>
